name: hilcoe_go
description: HiLCoE Go, a student companion app for classes, grades, exams and attendance.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  google_fonts: ^6.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  # Bundled so the app looks right offline; google_fonts finds them here.
  assets:
    - google_fonts/

# App icon: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1D4ED8"
  adaptive_icon_foreground: assets/icon/fg.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#1D4ED8"
    theme_color: "#1D4ED8"

# Launch screen: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1D4ED8"
  image: assets/icon/splash.png
  android_12:
    color: "#1D4ED8"
    image: assets/icon/splash.png
  web: true
